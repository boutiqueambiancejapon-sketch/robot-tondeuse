# Échecs de connexion au tableau de bord de quel-robot-tondeuse.com (réponses 401 de l'API de connexion).
# Install: sudo install -m 644 deploy/fail2ban/qrt-dashboard.conf /etc/fail2ban/filter.d/
[Definition]
failregex = "remote_ip":"<HOST>".*"host":"quel-robot-tondeuse\.com".*"uri":"/dashboard/connexion/api/[^"]*".*"status":401
ignoreregex =
journalmatch = _SYSTEMD_UNIT=caddy.service
