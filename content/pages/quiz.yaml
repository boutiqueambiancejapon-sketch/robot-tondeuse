title: "Quiz Robot Tondeuse"
subtitle: "Trouvez le robot tondeuse idéal pour votre jardin en quelques questions."
steps:
  - id: "surface"
    question: "Quelle est la surface de votre pelouse ?"
    options:
      - label: "Moins de 300 m²"
        value: "small"
      - label: "300 à 800 m²"
        value: "medium"
      - label: "800 à 2000 m²"
        value: "large"
      - label: "Plus de 2000 m²"
        value: "xlarge"
  - id: "pente"
    question: "Votre terrain a-t-il des pentes ?"
    options:
      - label: "Plat (moins de 15%)"
        value: "flat"
      - label: "Pentes modérées (15-25%)"
        value: "moderate"
      - label: "Fortes pentes (25%+)"
        value: "steep"
  - id: "budget"
    question: "Quel est votre budget ?"
    options:
      - label: "Moins de 800 €"
        value: "eco"
      - label: "800 à 1500 €"
        value: "mid"
      - label: "Plus de 1500 €"
        value: "high"
  - id: "installation"
    question: "Type d'installation souhaitée ?"
    options:
      - label: "Avec fil périphérique (classique)"
        value: "wire"
      - label: "Sans fil périphérique (RTK/vision)"
        value: "wireless"
      - label: "Peu importe"
        value: "any"
