title: "Quiz Robot Tondeuse"
subtitle: "Répondez à quelques questions, on vous dit quel robot est fait pour votre jardin."
steps:
  - id: "surface"
    question: "Quelle surface de pelouse ?"
    options:
      - label: "Moins de 400 m²"
        value: "small"
      - label: "400 à 1000 m²"
        value: "medium"
      - label: "1000 à 3000 m²"
        value: "large"
      - label: "Plus de 3000 m²"
        value: "xlarge"
  - id: "pente"
    question: "Votre terrain est en pente ?"
    options:
      - label: "Plutôt plat (moins de 15%)"
        value: "flat"
      - label: "Quelques pentes (15-25%)"
        value: "moderate"
      - label: "Grosses pentes (25%+)"
        value: "steep"
  - id: "budget"
    question: "Quel budget ?"
    options:
      - label: "Moins de 1000 €"
        value: "eco"
      - label: "1000 à 2000 €"
        value: "mid"
      - label: "Plus de 2000 €"
        value: "high"
  - id: "installation"
    question: "Prêt à poser un fil périphérique ?"
    options:
      - label: "Oui, pas de souci"
        value: "wire"
      - label: "Non, je veux du sans fil"
        value: "wireless"
      - label: "Peu importe"
        value: "any"
